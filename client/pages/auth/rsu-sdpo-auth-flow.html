<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RSU-SDPO | Sports Equipment &amp; Transaction Monitoring System</title>
  <style>
    :root{color-scheme:light;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%}
    body{background:#02180f}
    button{font:inherit;cursor:pointer}

    .page-hero{position:relative;min-height:100vh;display:grid;place-items:center;overflow:hidden;padding:32px 16px}
    .hero-background{position:absolute;inset:0;background-image:linear-gradient(162.93deg,rgba(2,112,79,.45) 7.95%,rgba(96,115,47,.4) 50%,rgba(152,117,28,.375) 71.03%,rgba(217,119,6,.35) 92.05%),url("../../assets/images/auth-hero-background.png");background-size:cover;background-position:center;background-repeat:no-repeat}
    .hero-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(2,112,79,.4) 0%,rgba(0,0,0,.28) 100%)}
    .hero-content{position:relative;z-index:1;width:min(92vw,720px);padding:40px 28px;display:grid;gap:28px;text-align:center;color:#fff}
    .brand-badge{position:relative;margin:0 auto;width:160px;height:160px}
    .badge-glow{position:absolute;inset:-18px;border-radius:50%;filter:blur(30px);opacity:.75;background:linear-gradient(135deg,#02704f,#d97706)}
    .badge-icon{position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden;border:6px solid #fff;background:#fff;box-shadow:0 25px 50px rgba(0,0,0,.25)}
    .badge-icon img{width:100%;height:100%;object-fit:cover}
    .hero-copy h1{margin:0;font-size:clamp(3rem,6vw,4.5rem);line-height:1;letter-spacing:-.03em}
    .hero-title-light{color:#fff}
    .hero-title-accent{color:#d97706}
    .hero-subtitle{margin:18px auto 0;max-width:500px;font-size:clamp(1rem,2vw,1.25rem);color:rgba(255,255,255,.95);line-height:1.6}
    .hero-button{display:inline-flex;align-items:center;justify-content:center;padding:14px 36px;margin-top:24px;border:none;border-radius:999px;background:#fff;color:#02704f;font-weight:700;box-shadow:0 20px 40px rgba(0,0,0,.18);transition:transform .2s ease,box-shadow .2s ease}
    .hero-button:hover{transform:translateY(-1px);box-shadow:0 24px 45px rgba(0,0,0,.22)}
    .hero-description,.hero-hint{margin:16px auto 0;max-width:520px}
    .hero-description{color:rgba(255,255,255,.9);font-size:1rem;line-height:1.6}
    .hero-hint{color:rgba(255,255,255,.7);font-size:.95rem}

    @media(max-width:640px){
      .hero-content{padding:24px 12px}
    }
  </style>
</head>
<body>
  <main class="page-hero" id="heroScreen">
    <div class="hero-background"></div>
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <div class="brand-badge">
        <div class="badge-glow"></div>
        <div class="badge-icon"><img src="../../assets/images/rsu-sdpo-logo.png" alt="RSU SDPO logo"></div>
      </div>
      <div class="hero-copy">
        <h1><span class="hero-title-light">RSU-</span><span class="hero-title-accent">SDPO</span></h1>
        <p class="hero-subtitle">Sports Equipment &amp; Transaction Monitoring System</p>
        <button class="hero-button" id="openLoginButton" type="button">Get Started</button>
        <p class="hero-description">Centralized Borrowing and Equipment Tracking</p>
        <p class="hero-hint">or tap anywhere to continue</p>
      </div>
    </div>
  </main>

  <script>
    function goToLogin() { window.location.href = 'user-login.html'; }
    document.getElementById('openLoginButton').addEventListener('click', goToLogin);
    document.getElementById('heroScreen').addEventListener('click', function (e) {
      if (!e.target.closest('#openLoginButton')) goToLogin();
    });
  </script>
</body>
</html>
